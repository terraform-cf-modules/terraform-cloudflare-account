description: |-
  Account bootstrap, members and groups, API tokens, notifications, Logpush, and secrets store.

  The root module is what a platform team runs once per Cloudflare account: the account object, the people who
  can reach it, and the baseline alerts that tell them when something is wrong. Seven submodules cover the rest
  of the account surface and are composed as needed.

  | Submodule | Resources |
  |-----------|-----------|
  | `member` | `cloudflare_account_member`, `cloudflare_user_group`, `cloudflare_user_group_members` |
  | `api-token` | `cloudflare_api_token`, `cloudflare_account_token` |
  | `notification` | `cloudflare_notification_policy`, `cloudflare_notification_policy_webhooks` |
  | `logpush` | `cloudflare_logpush_job`, `cloudflare_logpush_ownership_challenge`, `cloudflare_logpull_retention` |
  | `secrets-store` | `cloudflare_secrets_store`, `cloudflare_secrets_store_secret` |
  | `dns-settings` | `cloudflare_account_dns_settings`, `cloudflare_dns_firewall` |
  | `sharing` | `cloudflare_share`, `cloudflare_share_recipient`, `cloudflare_share_resource` |

  Targets Cloudflare provider v5. Cloudflare rewrote the provider from its OpenAPI spec in v5.0.0 and renamed
  most resources, so verify resource names and attributes against the current provider documentation rather than
  from memory or from older examples.

usage: |-
  ### Root module

  ```hcl
  module "account" {
    source  = "terraform-cf-modules/account/cloudflare"
    version = "~> 0.1"

    enabled    = true
    account_id = var.account_id

    members = {
      platform_lead = {
        email = "platform@example.com"
        roles = [var.administrator_role_id]
      }
    }

    notification_policies = {
      origin_errors = {
        name       = "Origin error rate"
        alert_type = "http_alert_origin_error"
        emails     = ["platform@example.com"]
      }
    }
  }
  ```

  ### Submodule

  ```hcl
  module "api_token" {
    source  = "terraform-cf-modules/account/cloudflare//modules/api-token"
    version = "~> 0.1"

    enabled    = true
    account_id = var.account_id

    account_tokens = {
      ci = {
        name = "ci-dns"

        policies = {
          dns_edit = {
            effect               = "allow"
            permission_group_ids = [var.dns_write_permission_group_id]

            resources = {
              "com.cloudflare.api.account.zone.${var.zone_id}" = "*"
            }
          }
        }
      }
    }
  }
  ```

  ### Wrapper for many accounts

  ```hcl
  module "accounts" {
    source = "terraform-cf-modules/account/cloudflare//wrappers"

    defaults = {
      notification_policies = {
        origin_errors = {
          name       = "Origin error rate"
          alert_type = "http_alert_origin_error"
          emails     = ["platform@example.com"]
        }
      }
    }

    items = {
      production = { account_id = var.production_account_id }
      staging    = { account_id = var.staging_account_id }
    }
  }
  ```
